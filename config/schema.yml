openapi: 3.0.3
info:
  title: JumpUp UTE — API de Aprendizaje de Idiomas
  version: 1.0.0
  description: API REST completa para plataforma educativa con cursos, gamificación,
    clases virtuales, certificados y suscripciones. Desarrollada con Django REST Framework
    + PostgreSQL.
  contact:
    name: Danny Guamán
    email: alexander18br17@gmail.com
  license:
    name: MIT
paths:
  /api/achievements/:
    get:
      operationId: achievements_list
      description: |-
        GET /api/achievements/        — Catálogo de logros disponibles
        GET /api/achievements/{id}/   — Detalle
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: trigger_type
        schema:
          type: string
          enum:
          - course
          - manual
          - messages
          - streak
          - xp
        description: |-
          * `xp` - Por XP acumulado
          * `streak` - Por racha de días
          * `course` - Por cursos completados
          * `messages` - Por mensajes enviados
          * `manual` - Manual / admin
      tags:
      - achievements
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAchievementList'
          description: ''
  /api/achievements/{id}/:
    get:
      operationId: achievements_retrieve
      description: |-
        GET /api/achievements/        — Catálogo de logros disponibles
        GET /api/achievements/{id}/   — Detalle
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este achievement.
        required: true
      tags:
      - achievements
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Achievement'
          description: ''
