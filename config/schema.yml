components:
  schemas:
    Achievement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
        icon_url:
          type: string
          format: uri
          nullable: true
          maxLength: 200
        required_xp:
          type: integer
          maximum: 2147483647
          minimum: 0
        trigger_type:
          $ref: '#/components/schemas/TriggerTypeEnum'
        required_value:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Valor umbral para el trigger (días de racha, cursos, etc.)
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
      - description
      - id
      - name
    Announcement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        author:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        content:
          type: string
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - content
      - created_at
      - end_date
      - id
      - start_date
      - title
    AttachmentTypeEnum:
      enum:
      - image
      - audio
      - document
      - other
      type: string
      description: |-
        * `image` - Imagen
        * `audio` - Audio
        * `document` - Documento
        * `other` - Otro
    BackupHistory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        backup_name:
          type: string
          readOnly: true
        file_path:
          type: string
          readOnly: true
        size:
          type: integer
          readOnly: true
          description: Tamaño en bytes
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - backup_name
      - created_at
      - file_path
      - id
      - size
    BlankEnum:
      enum:
      - ''
    Certificate:
      type: object
      description: Serializer de Certificate para lectura (estudiante y admin).
      properties:
        id:
          type: integer
          readOnly: true
        student:
          type: integer
        student_email:
          type: string
          format: email
          readOnly: true
        issued_by:
          type: integer
          nullable: true
        issued_by_email:
          type: string
          format: email
          readOnly: true
        level:
          allOf:
          - $ref: '#/components/schemas/LevelEnum'
          description: |-
            Nivel MCER: A1, A2, B1, B2, C1, C2

            * `A1` - Principiante A1
            * `A2` - Elemental A2
            * `B1` - Intermedio B1
            * `B2` - Intermedio Alto B2
            * `C1` - Avanzado C1
            * `C2` - Maestría C2
        level_display:
          type: string
          readOnly: true
        title:
          type: string
          description: 'Ej: "Certificado de Inglés A1 — JumpUp UTE"'
          maxLength: 200
        description:
          type: string
        certificate_code:
          type: string
          readOnly: true
          description: Código único de verificación del certificado
        status:
          $ref: '#/components/schemas/StatusEcfEnum'
        status_display:
          type: string
          readOnly: true
        issued_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - certificate_code
      - created_at
      - id
      - issued_by_email
      - level
      - level_display
      - status_display
      - student
      - student_email
      - title
