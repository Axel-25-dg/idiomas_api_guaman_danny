  /api/resources/:
    get:
      operationId: resources_list
      description: |-
        Materiales del profesor (PDF, audio, video, Word, imagen, enlace).

        TEACHER / ADMIN:
          GET    /api/resources/           — Todos los recursos públicos + los suyos propios
          POST   /api/resources/           — Subir nuevo recurso
          GET    /api/resources/{id}/      — Detalle
          PUT    /api/resources/{id}/      — Actualizar (solo el dueño o admin)
          DELETE /api/resources/{id}/      — Eliminar (solo el dueño o admin)

        STUDENT:
          GET    /api/resources/           — Solo recursos públicos (is_public=True)
          GET    /api/resources/{id}/      — Detalle de recurso público

        Filtros disponibles:
          ?resource_type=pdf
          ?course=1
          ?lesson=1
          ?is_public=true
          ?search=gramática
      parameters:
      - in: query
        name: course
        schema:
          type: integer
      - in: query
        name: is_public
        schema:
          type: boolean
      - in: query
        name: lesson
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: resource_type
        schema:
          type: string
          enum:
          - audio
          - image
          - link
          - other
          - pdf
          - video
          - word
        description: |-
          * `pdf` - PDF
          * `audio` - Audio
          * `video` - Video
          * `word` - Documento Word
          * `image` - Imagen
          * `link` - Enlace externo
          * `other` - Otro
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - resources
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTeacherResourceList'
          description: ''
    post:
