    StaffUser:
      type: object
      description: |-
        Gestión de usuarios de personal (teachers, admins).
        Solo accesible por admins desde /api/users/.
        Al asignar role_id, User.save() sincroniza automáticamente is_staff e is_superuser.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          title: Nombre de usuario
          description: 'Requerido. 150 carácteres como máximo. Únicamente letras,
            dígitos y @/./+/-/_ '
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          title: Nombre
          maxLength: 150
        last_name:
          type: string
          title: Apellidos
          maxLength: 150
        role:
          allOf:
          - $ref: '#/components/schemas/Role'
          readOnly: true
        role_id:
          type: integer
          writeOnly: true
        is_staff:
          type: boolean
          readOnly: true
          title: Es staff
          description: Indica si el usuario puede entrar en este sitio de administración.
        is_superuser:
          type: boolean
          readOnly: true
          title: Estado de superusuario
          description: Indica que este usuario tiene todos los permisos sin asignárselos
            explícitamente.
        is_active:
          type: boolean
        password:
          type: string
          writeOnly: true
      required:
      - email
      - id
      - is_staff
      - is_superuser
      - role
      - role_id
      - username
