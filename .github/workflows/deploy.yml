name: Deploy to Production VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          cd ~/idiomas_api_guaman_danny

          # 1. Traer los últimos cambios desde GitHub de forma segura
          git fetch origin main
          git reset --hard origin/main

          # 2. Activar el entorno e instalar nuevas librerías si existen
          source .venv/bin/activate
          pip install -r requirements.txt

          # 3. Resolver posibles conflictos de migraciones automáticamente y aplicarlas
          python manage.py makemigrations --merge --noinput
          python manage.py migrate

          # 4. Recopilar archivos estáticos
          python manage.py collectstatic --noinput

          # 5. Reiniciar el servicio correcto de Gunicorn para Idiomas API
          sudo systemctl restart gunicorn-idiomas.service || echo "Gunicorn Idiomas failed to restart"
          sudo systemctl restart daphne-idiomas.service || echo "Daphne Idiomas failed to restart"

          # 6. Verificación de que levantó correctamente
          sleep 5
          systemctl is-active --quiet gunicorn-idiomas.service && echo "Gunicorn Idiomas OK" || echo "Gunicorn Idiomas NOT running"
          systemctl is-active --quiet daphne-idiomas.service && echo "Daphne Idiomas OK" || echo "Daphne Idiomas NOT running"
