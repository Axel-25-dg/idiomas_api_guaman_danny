{% extends 'emails/email_base.html' %}
{% block content %}
<p>Hola <strong>{{ user.username }}</strong>,</p>

<div style="background-color: #f8fafc; border: 1px solid #e2e8f0; padding: 25px; border-radius: 8px; margin: 20px 0;">
    {{ message|linebreaks }}
</div>

{% if action_url %}
<div class="button-container">
    <a href="{{ action_url }}" class="button">{{ action_text|default:"Ver más" }}</a>
</div>
{% endif %}

<p style="font-size: 14px; color: #718096;">
    Este es un mensaje personalizado enviado por el equipo académico de JumpUp UTE.
</p>
{% endblock %}
