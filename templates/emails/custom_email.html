{% extends 'emails/email_base.html' %}
{% block content %}
<p>Hola <strong>{{ user.username }}</strong>,</p>

<div class="info-box" style="font-size: 16px; line-height: 1.8;">
    {{ message|linebreaks }}
</div>

{% if action_url %}
<div class="button-container">
    <a href="{{ action_url }}" class="button">{{ action_text|default:"Ver más" }}</a>
</div>
{% endif %}

<div class="divider"></div>
<p style="font-size: 14px; color: #718096; text-align: center;">
    Este es un mensaje enviado por el equipo académico de <strong>JumpUp UTE</strong>.
</p>
{% endblock %}
