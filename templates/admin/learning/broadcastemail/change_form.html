{% extends "admin/change_form.html" %}
{% load i18n %}

{% block submit_buttons_bottom %}
    {{ block.super }}
    {% if show_send_button %}
    <div class="submit-row" style="margin-top: 10px;">
        <input
            type="submit"
            name="_send_now"
            value="📧 Enviar ahora"
            class="default"
            style="background: #198754; color: white; border: none; padding: 10px 20px;
                   font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer;"
            onclick="return confirm('¿Estás seguro de que quieres enviar este correo masivo ahora?');"
        />
        <p class="help" style="color: #666; margin-top: 6px; font-size: 12px;">
            ⚠️ Este correo se enviará a todos los usuarios según la audiencia seleccionada. Esta acción no se puede deshacer.
        </p>
    </div>
    {% endif %}
{% endblock %}
