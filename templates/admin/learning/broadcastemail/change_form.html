{% extends "admin/change_form.html" %} {% load i18n %} {% block
submit_buttons_bottom %} {{ block.super }} {% if show_send_button %}
<div
  class="submit-row"
  style="
    margin-top: 15px;
    padding: 15px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
  "
>
  <input
    type="submit"
    name="_send_now"
    value="📧 Enviar ahora"
    class="default"
    style="
      background: #16a34a;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      font-family:
        -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto,
        Helvetica, Arial, sans-serif;
    "
    onclick="
      return confirm(
        '¿Estás seguro de que quieres enviar este correo masivo ahora?',
      );
    "
  />
  <p
    class="help"
    style="
      color: #64748b;
      margin: 8px 0 0 0;
      font-size: 13px;
      font-family:
        -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto,
        Helvetica, Arial, sans-serif;
      line-height: 1.5;
    "
  >
    ⚠️ Este correo se enviará a todos los usuarios según la audiencia
    seleccionada. Esta acción no se puede deshacer.
  </p>
</div>
{% endif %} {% endblock %}
